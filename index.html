  <meta name="theme-color" content="#FAF9F5">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

<body>

      <span class="logo-linha1">thiago</span>
      <span class="logo-linha2">com<span class="logo-h">h</span></span>

    <!-- Cena animada: bonequinhos construindo o site -->
    <svg class="cena" viewBox="0 0 640 380" role="img" aria-label="Bonequinhos construindo um site">
      <!-- chão -->
      <line x1="20" y1="340" x2="620" y2="340" class="chao"></line>

      <!-- janela do navegador -->
      <g transform="translate(170 50)">
        <rect x="0" y="0" width="300" height="230" rx="14" class="janela"></rect>
        <line x1="0" y1="36" x2="300" y2="36" class="contorno"></line>
        <circle cx="22" cy="18" r="5" class="amarelo"></circle>
        <circle cx="40" cy="18" r="5" class="cinza"></circle>
        <circle cx="58" cy="18" r="5" class="cinza"></circle>

        <rect x="20" y="52" width="260" height="18" rx="6" class="bloco b1 cinza"></rect>
        <rect x="20" y="82" width="170" height="60" rx="8" class="bloco b2 amarelo"></rect>
        <rect x="200" y="82" width="80" height="60" rx="8" class="bloco b3 cinza"></rect>
        <rect x="20" y="156" width="74" height="56" rx="8" class="bloco b4 card"></rect>
        <rect x="113" y="156" width="74" height="56" rx="8" class="bloco b5 card"></rect>
        <rect x="206" y="156" width="74" height="56" rx="8" class="bloco b6 card"></rect>
      </g>

      <!-- escada -->
      <g class="contorno">
        <line x1="530" y1="340" x2="478" y2="120"></line>
        <line x1="560" y1="340" x2="508" y2="120"></line>
        <line x1="525" y1="318" x2="555" y2="318"></line>
        <line x1="515" y1="276" x2="545" y2="276"></line>
        <line x1="505" y1="234" x2="535" y2="234"></line>
        <line x1="495" y1="192" x2="525" y2="192"></line>
        <line x1="485" y1="150" x2="515" y2="150"></line>
      </g>

      <!-- boneco na escada, martelando -->
      <g transform="translate(516 234)">
        <line x1="-6" y1="-50" x2="-12" y2="0" class="corpo perna"></line>
        <line x1="-6" y1="-50" x2="8" y2="0" class="corpo perna"></line>
        <line x1="0" y1="-100" x2="-6" y2="-50" class="corpo tronco"></line>
        <circle cx="2" cy="-118" r="13" class="cabeca"></circle>
        <line x1="0" y1="-92" x2="14" y2="-62" class="corpo perna"></line>
        <g class="martelo">
          <line x1="0" y1="-92" x2="-28" y2="-104" class="corpo perna"></line>
          <line x1="-28" y1="-104" x2="-36" y2="-80" class="cabo"></line>
          <rect x="-46" y="-86" width="20" height="10" rx="3" class="cabeca"></rect>
        </g>
      </g>
      <g class="faiscas">
        <line x1="476" y1="160" x2="466" y2="152"></line>
        <line x1="476" y1="170" x2="464" y2="172"></line>
        <line x1="478" y1="180" x2="470" y2="188"></line>
      </g>

      <!-- boneco carregando bloco amarelo -->
      <g class="andando">
        <g transform="translate(60 340)">
          <line x1="0" y1="-50" x2="-12" y2="0" class="corpo perna passo-a"></line>
          <line x1="0" y1="-50" x2="12" y2="0" class="corpo perna passo-b"></line>
          <line x1="0" y1="-100" x2="0" y2="-50" class="corpo tronco"></line>
          <line x1="0" y1="-92" x2="-16" y2="-132" class="corpo perna"></line>
          <line x1="0" y1="-92" x2="16" y2="-132" class="corpo perna"></line>
          <circle cx="0" cy="-118" r="13" class="cabeca"></circle>
          <rect x="-24" y="-160" width="48" height="28" rx="5" class="amarelo contorno-fino"></rect>
        </g>
      </g>
    </svg>

    <h1>Site em construção</h1>
    <p class="texto">Estou preparando meu currículo e portfólio. Logo você vai ver aqui os sites que eu já criei.</p>

    <div class="barra" role="progressbar" aria-label="Progresso do site" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
      <span class="barra-preenchida"></span>

    <p class="texto">Quer um site para o seu negócio? Fale comigo:</p>
    <div class="botoes">
